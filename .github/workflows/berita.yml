name: Spion Berita Otomatis

on:
  schedule:
    # Jadwal otomatis: Berjalan tiap 3 jam sekali
    - cron:'*/5 * * * *'
  workflow_dispatch: # Biar bisa ditrigger manual juga kalau lagi pengen

jobs:
  run-spion:
    runs-on: ubuntu-latest
    steps:
      - name: Tarik kode dari repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pustaka (Library) yang dibutuhkan
        run: |
          pip install feedparser beautifulsoup4 requests

      - name: Jalankan Spion Berita
        run: |
          python cek_berita.py
